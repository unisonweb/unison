name: merge queue

defaults:
  run:
    shell: bash

on:
  merge_group:

jobs:
  tests:
    name: merge queue tests
    uses: ./.github/workflows/test.yaml
    with:
      skip-attested-transcripts: true
    # transcripts-os defaults to linux only
    # dll-ffi-os defaults to all platforms

  # Single gate job for merge queue required checks, since `tests` calls a
  # reusable workflow with multiple jobs and we want to require all of them
  # to pass before landing.
  gate:
    name: merge queue gate
    if: ${{ !cancelled() }}
    needs: [tests]
    runs-on: ubuntu-24.04
    steps:
      - name: check all jobs
        run: |
          if [[ "${{ needs.tests.result }}" != "success" ]]; then
            echo "tests result: ${{ needs.tests.result }}"
            exit 1
          fi
