name: format

defaults:
  run:
    shell: bash

on:
  # Run on the post-merge result of every PR commit
  pull_request:
  workflow_dispatch:

env:
  ## Some version numbers that are used during CI
  ormolu_version: 0.8.0.2

jobs:
  check-formatting-proof:
    name: check formatting proof
    runs-on: ubuntu-24.04
    outputs:
      attested: ${{ steps.check.outputs.attested }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: check formatting proof
        id: check
        run: |
          read -r RESULT HASH <<< "$(./scripts/proofs/formatting.sh --check)"
          if [[ "$RESULT" == "pass" ]]; then
            echo "Formatting proof: pass ($HASH)"
            echo "attested=true" >> "$GITHUB_OUTPUT"
          elif [[ "$RESULT" == "fail" ]]; then
            echo "::error::Formatting previously FAILED for hash $HASH"
            exit 1
          else
            echo "Formatting proof: $RESULT ($HASH)"
            echo "attested=false" >> "$GITHUB_OUTPUT"
          fi

  ormolu:
    needs: check-formatting-proof
    if: needs.check-formatting-proof.outputs.attested != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@2d756ea4c53f7f6b397767d8723b3a10a9f35bf2 # v44
        with:
          # globs copied from default settings for run-ormolu
          files: |
            **/*.hs
            **/*.hs-boot
          # allows the `separator` to actually be a newline (see tj-actions/changed-files#2148)
          safe_output: false
          separator: "\n"
      # The job doesn't have permission to push back to contributor forks on contributor PRs, or on protected branches,
      # so in those cases, we only check the formatting.
      - uses: haskell-actions/run-ormolu@c5eec49879ee294be01c787bcbf7b5a373a37060 # v17
        if: |
          github.ref_protected
            || !(github.event.pull_request.base.repo.full_name == github.event.pull_request.head.repo.full_name)
        with:
          version: ${{ env.ormolu_version }}
          mode: check
          pattern: ${{ steps.changed-files.outputs.all_changed_files }}
      - uses: haskell-actions/run-ormolu@c5eec49879ee294be01c787bcbf7b5a373a37060 # v17
        if: |
          !github.ref_protected
            && github.event.pull_request.base.repo.full_name == github.event.pull_request.head.repo.full_name
        with:
          version: ${{ env.ormolu_version }}
          mode: inplace
          pattern: ${{ steps.changed-files.outputs.all_changed_files }}
      - name: apply formatting changes
        uses: stefanzweifel/git-auto-commit-action@e348103e9026cc0eee72ae06630dbe30c8bf7a79 # v5
        if: |
          !github.ref_protected
            && github.event.pull_request.base.repo.full_name == github.event.pull_request.head.repo.full_name
        with:
          commit_message: automatically run ormolu
