name: ci dispatch

on:
  push:
    branches-ignore:
      - 'gh-readonly-queue/**'
      - 'trunk'
  pull_request:
  merge_group:

jobs:
  quick:
    name: ${{ github.event_name == 'push' && 'quick (branch push)' || github.event_name == 'pull_request' && 'quick (fork PR)' || 'quick' }}
    if: (github.event_name == 'push' && github.ref != 'refs/heads/trunk') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    uses: ./.github/workflows/ci.yaml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
  full:
    name: ${{ github.event_name == 'merge_group' && 'full (merge queue)' || 'full' }}
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/test.yaml
    with:
      skip-attested-transcripts: true
  ci-result:
    if: ${{ !cancelled() }}
    needs: [quick, full]
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: check results
        id: check
        run: |
          if [[ "${{ needs.quick.result }}" == "failure" ]]; then
            echo "::error::Quick check failed. Please fix the issues and push again."
            exit 1
          elif [[ "${{ needs.full.result }}" == "failure" ]]; then
            echo "::error::Full check failed. Please fix the issues and push again."
            exit 1
          else
            echo "All checks passed!"
          fi
      # A failed merge-queue run removes the pull request from the queue
      # without telling anyone on the pull request itself; the merge-group ref
      # (refs/heads/gh-readonly-queue/<base>/pr-<number>-<sha>) names it.
      - name: tell the pull request when its merge-queue run failed
        if: failure() && github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          number=$(sed -n 's|^refs/heads/gh-readonly-queue/.*/pr-\([0-9]*\)-[0-9a-f]*$|\1|p' <<< "$HEAD_REF")
          if [[ -z "$number" ]]; then
            echo "Could not find the pull request number in $HEAD_REF"
            exit 0
          fi
          gh pr comment "$number" --repo "${{ github.repository }}" --body "🤖 The merge queue's full run failed, which removed this pull request from the queue: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
