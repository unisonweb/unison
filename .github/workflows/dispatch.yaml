name: ci dispatch

on:
  push:
  pull_request:
  merge_group:

jobs:
  quick-check:
    if: (github.event_name == 'push' && github.ref != 'refs/heads/trunk') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    uses: ./.github/workflows/ci.yaml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
  full-check:
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/test.yaml
    with:
      skip-attested-transcripts: true
  ci-result:
    needs: [quick-check, full-check]
    runs-on: ubuntu-24.04
    steps:
      - name: check results
        run: |
          if [[ "${{ needs.quick-check.result }}" == "failure" ]]; then
            echo "::error::Quick check failed. Please fix the issues and push again."
            exit 1
          elif [[ "${{ needs.full-check.result }}" == "failure" ]]; then
            echo "::error::Full check failed. Please fix the issues and push again."
            exit 1
          else
            echo "All checks passed!"
          fi
