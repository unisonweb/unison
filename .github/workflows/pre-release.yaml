# Builds and publishes a rolling dev build after each merge to trunk.
# No tests currently — relies on the merge queue having already tested the code.
name: pre-release
run-name: pre-release ${{github.ref_name}}

# Cancel earlier builds if we restart the workflow on a new commit.
concurrency:
  group: pre-release-${{ github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

on:
  # run on each merge to `trunk`
  push:
    branches: [trunk]

  # run manually
  workflow_dispatch:

jobs:
  bundle-ucm:
    name: build and bundle ucm
    uses: ./.github/workflows/bundle-ucm.yaml
    with:
      ref: ${{ github.ref }}

  release:
    name: create release
    runs-on: ubuntu-24.04
    needs:
      - bundle-ucm

    steps:
      - name: make download dir
        run: mkdir /tmp/ucm

      - name: "download artifacts"
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          path: /tmp/ucm

      - name: derive release tag
        run: echo "ref_name=$(echo ${{ github.ref_name }} | awk -F'/' '{print $NF}')" >> $GITHUB_ENV

      - uses: "marvinpinto/action-automatic-releases@d68defdd11f9dcc7f52f35c1b7c236ee7513bcc1" # latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: ${{ env.ref_name }}-build
          prerelease: true
          title: Development Build (${{ env.ref_name }})
          files: |
            /tmp/ucm/**/ucm-*.tar.gz
            /tmp/ucm/**/ucm-*.zip
