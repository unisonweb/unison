name: bundle ucm

# build optimized ucm

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out for this build, e.g. `trunk` or `release/0.5.19`
        type: string
        required: true

defaults:
  run:
    shell: bash

jobs:
  build-ucm:
    name: build ucm
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
          - windows-2025
          # - windows-11-arm # 2025-06-17 apparently there's no stack or ghc builds for arm64 windows
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{inputs.ref}}

      - name: restore stack caches
        uses: unisonweb/actions/stack/cache/restore@main
        with:
          cache-prefix: release

      - name: install stack
        uses: unisonweb/actions/stack/install@main
        with:
          stack-version: 3.9.3

      - name: build
        run: |
          # unison-cli-main and the runtime (Unison.Runtime.Version) embed
          # version numbers using TH, so they need to be forced to rebuild to
          # ensure those are updated. ucm and unisonrt have to agree on the
          # runtime's version for ucm's bundles to run.
          stack clean unison-cli-main unison-runtime

          mkdir ucm-bin

          # Windows will crash on build intermittently because the filesystem
          # sucks at managing concurrent file access;
          # Just keep retrying on these failures.
          tries=5
          for (( i = 0; i < $tries; i++ )); do
              stack build --only-dependencies && break
          done

          # unisonrt runs compiled programs, and is what ucm's `bundle` copies
          # (unison-runtime/unisonrt/README.md); minify makes it smaller
          if [[ ${{runner.os}} = 'Windows' ]]; then
            targets=":unison :unisonrt"
            exe=.exe
          else
            targets=":unison :unisonrt minify:exe:minify"
            exe=
          fi
          stack build $targets \
                --ghc-options='-O2' \
                --local-bin-path ucm-bin \
                --copy-bins

          # minify doesn't read Windows executables and isn't ready for Linux
          # x86-64: there, unisonrt ships whole. It
          # needs unisonrt's symbol table, which Stack strips when it copies
          # an executable on Linux: the build directory's is whole.
          minified=yes
          [[ ${{runner.os}} = 'Windows' ]] && minified=no
          [[ ${{runner.os}} = 'Linux' && ${{runner.arch}} = 'X64' ]] && minified=no
          if [[ $minified = yes ]]; then
            whole="unison-runtime/$(cd unison-runtime && stack path --dist-dir)/build/unisonrt/unisonrt"
            ucm-bin/minify "$whole" -o ucm-bin/unisonrt-min --strip --verify
            mv ucm-bin/unisonrt-min ucm-bin/unisonrt
            rm ucm-bin/minify
          fi

          echo ucm="ucm-bin/unison$exe" >> $GITHUB_ENV
          echo unisonrt="ucm-bin/unisonrt$exe" >> $GITHUB_ENV
          ls -l ucm-bin

      - name: check a bundle runs
        if: runner.os != 'Windows'
        run: |
          mkdir bundle-check
          cd bundle-check
          cat > check.md <<'EOF'
          ```ucm :hide
          scratch/main> builtins.merge lib.builtin
          ```

          ```unison :hide
          main : '{IO, Exception} ()
          main = do
            match putBytes.impl (stdHandle StdOut) (Text.toUtf8 "bundled") with
              Right () -> ()
              Left f -> Exception.raise f
          ```

          ```ucm :hide
          scratch/main> add
          scratch/main> bundle main hello
          ```
          EOF
          ../ucm-bin/unison transcript check.md
          test "$(./hello)" = bundled

      - name: save stack caches
        uses: unisonweb/actions/stack/cache/save@main
        with:
          cache-prefix: release

      - name: upload ucm
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: unison-${{matrix.os}}
          path: |
            ${{ env.ucm }}
            ${{ env.unisonrt }}
          if-no-files-found: error

      - name: report errors
        if: github.ref == 'refs/heads/trunk' && failure()
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # https://github.com/slackapi/slack-github-action/releases/tag/v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
              text: "build-ucm failed on ${{ github.ref }}. See details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} cc <@UF924D5S7>"

  bundle:
    name: bundle ucm and ui
    needs: [build-ucm]
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
          - windows-2025
          # - windows-11-arm
    steps:
      - name: set up environment
        run: |
          staging_dir="${RUNNER_TEMP//\\//}/ucm-staging"
          artifact_os="$(echo "${RUNNER_OS}-${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')"
          echo "staging_dir=$staging_dir" >> $GITHUB_ENV
          echo "artifact_os=$artifact_os" >> $GITHUB_ENV
      - name: download ucm
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          name: unison-${{matrix.os}}
          path: ${{env.staging_dir}}/unison/
      - name: restore permissions on ucm
        run: chmod +x ${{env.staging_dir}}/unison/unison ${{env.staging_dir}}/unison/unisonrt*
      - name: download latest unison-local-ui
        run: |
          curl -L -o /tmp/unisonLocal.zip \
            https://github.com/unisonweb/unison-local-ui/releases/download/latest/unisonLocal.zip
          unzip -d ${{env.staging_dir}}/ui /tmp/unisonLocal.zip
      - name: create startup script (non-Windows)
        if: runner.os != 'Windows'
        uses: 1arp/create-a-file-action@29bab1af4675373aad48a2157c09f1917f85f008 # 0.4.4
        with:
          path: ${{env.staging_dir}}
          file: ucm
          content: |
            #!/usr/bin/env bash
            unison_root="$(dirname "$(readlink -f "$0")")"
            export UCM_WEB_UI="${unison_root}/ui"
            "${unison_root}/unison/unison" "$@"
      - name: create startup script (Windows)
        if: runner.os == 'Windows'
        uses: 1arp/create-a-file-action@29bab1af4675373aad48a2157c09f1917f85f008 # 0.4.4
        with:
          path: ${{env.staging_dir}}
          file: ucm.cmd
          content: |
            @echo off
            SET UCM_WEB_UI=%~dp0ui
            "%~dp0unison\unison.exe" %*
      - name: package everything together
        run: |
          if [[ ${{runner.os}} = 'Windows' ]]; then
            artifact_archive=ucm-${{env.artifact_os}}.zip
            7z a -r -tzip ${artifact_archive} ${{env.staging_dir}}/*
          else
            chmod +x ${{env.staging_dir}}/ucm
            artifact_archive=ucm-${{env.artifact_os}}.tar.gz
            tar -c -z -f ${artifact_archive} -C ${{env.staging_dir}} .
          fi
          echo "artifact_archive=${artifact_archive}" >> $GITHUB_ENV
      - name: upload artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: bundle-${{env.artifact_os}}
          path: ${{env.artifact_archive}}
          if-no-files-found: error
