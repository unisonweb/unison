name: CI

defaults:
  run:
    shell: bash

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify-transcripts:
    name: verify transcripts proof
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: sudo apt-get install -y ripgrep
      - name: verify transcript proof
        run: |
          RESULT=$(./scripts/proofs/transcripts.sh --verbose --check)
          echo "Transcript proof: $RESULT"
          if [[ "$RESULT" == "pass" ]]; then
            exit 0
          elif [[ "$RESULT" == "fail" ]]; then
            echo "::error::Transcripts previously FAILED. Fix and re-run './scripts/proofs/transcripts.sh'."
            exit 1
          else
            echo "::error::Transcript proof not found. Run './scripts/proofs/transcripts.sh', commit the proofs file, and push again."
            exit 1
          fi

  verify-tests:
    name: verify tests proof
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: sudo apt-get install -y ripgrep
      - name: verify test proof
        run: |
          RESULT=$(./scripts/proofs/tests.sh --verbose --check)
          echo "Test proof: $RESULT"
          if [[ "$RESULT" == "pass" ]]; then
            exit 0
          elif [[ "$RESULT" == "fail" ]]; then
            echo "::error::Tests previously FAILED. Fix and re-run './scripts/proofs/tests.sh'."
            exit 1
          else
            echo "::error::Test proof not found. Run './scripts/proofs/tests.sh', commit the proofs file, and push again."
            exit 1
          fi

  verify-proofs:
    name: verify proofs
    needs: [verify-transcripts, verify-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: check all proofs
        run: |
          if [[ "${{ needs.verify-transcripts.result }}" != "success" ]]; then
            echo "verify-transcripts: ${{ needs.verify-transcripts.result }}"
            exit 1
          fi
          if [[ "${{ needs.verify-tests.result }}" != "success" ]]; then
            echo "verify-tests: ${{ needs.verify-tests.result }}"
            exit 1
          fi
