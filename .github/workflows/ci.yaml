name: CI

defaults:
  run:
    shell: bash

on:
  push:
  merge_group:
  workflow_dispatch:

jobs:
  # Verify proofs on feature branches (not trunk, since trunk runs actual tests)
  # This runs on a single platform since it just checks file contents
  verify-proofs:
    name: verify proofs
    # Don't run on trunk or in merge queue (merge queue runs actual tests)
    if: github.ref != 'refs/heads/trunk' && github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - run: sudo apt install ripgrep
      - name: verify transcript proof
        run: |
          PROOFS_FILE=".github/workflows/proofs/transcripts.txt"
          echo "Computing transcript hash..."
          HASH=$(./scripts/proofs/transcripts.sh --hash)
          echo "Hash: $HASH"

          # Check if proof file exists and contains our hash with pass status
          # Format: "source_hash infra_hash pass|fail"
          PROOF_LINE=""
          if [[ -f "$PROOFS_FILE" ]]; then
            PROOF_LINE=$(grep "^$HASH" "$PROOFS_FILE" || true)
          fi

          RESULT=$(echo "$PROOF_LINE" | awk '{print $3}')

          if [[ "$RESULT" == "pass" ]]; then
            echo "Transcript proof verified (passed)!"
          elif [[ "$RESULT" == "fail" ]]; then
            cat <<EOF

          ERROR: Transcripts previously FAILED.

          The proofs file shows that transcripts failed on this commit.
          Fix the issues, run './scripts/proofs/transcripts.sh',
          commit the updated proofs file, and push again.
          EOF
            exit 1
          else
            cat <<EOF

          ERROR: Transcript proof not found.

          This repo uses a proof system to skip transcript tests in CI when
          you've already run them locally. The proof is a hash of all source
          files that affect transcripts (*.hs, *.md, *.u, build configs).

          Expected hash: $HASH
          Proofs file:   $(cat "$PROOFS_FILE" 2>/dev/null || echo "(not found)")

          This usually means you changed code after running transcripts,
          or haven't run them yet.

          To fix: run './scripts/proofs/transcripts.sh', commit the
          proofs file, and push again.

          TIP: The pre-push hook handles this automatically on push:
            ./scripts/hooks/install.bash
          EOF
            exit 1
          fi

      - name: verify test proof
        run: |
          PROOFS_FILE=".github/workflows/proofs/tests.txt"
          echo "Computing test hash..."
          HASH=$(./scripts/proofs/tests.sh --hash)
          echo "Hash: $HASH"

          # Check if proof file exists and contains our hash with pass status
          # Format: "source_hash infra_hash pass|fail"
          PROOF_LINE=""
          if [[ -f "$PROOFS_FILE" ]]; then
            PROOF_LINE=$(grep "^$HASH" "$PROOFS_FILE" || true)
          fi

          RESULT=$(echo "$PROOF_LINE" | awk '{print $3}')

          if [[ "$RESULT" == "pass" ]]; then
            echo "Test proof verified (passed)!"
          elif [[ "$RESULT" == "fail" ]]; then
            cat <<EOF

          ERROR: Tests previously FAILED.

          The proofs file shows that tests failed on this commit.
          Fix the issues, run './scripts/proofs/tests.sh',
          commit the updated proofs file, and push again.
          EOF
            exit 1
          else
            cat <<EOF

          ERROR: Test proof not found.

          This repo uses a proof system to skip tests in CI when you've
          already run them locally. The proof is a hash of all source files
          that affect tests (*.hs, build configs, integration test inputs).

          Expected hash: $HASH
          Proofs file:   $(cat "$PROOFS_FILE" 2>/dev/null || echo "(not found)")

          This usually means you changed code after running tests,
          or haven't run them yet.

          To fix: run './scripts/proofs/tests.sh', commit the
          proofs file, and push again.

          TIP: The pre-push hook handles this automatically on push:
            ./scripts/hooks/install.bash
          EOF
            exit 1
          fi

  # Run tests in merge queue to validate before landing on trunk
  merge-queue-tests:
    name: merge queue tests
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/test.yaml
    # transcripts-os defaults to linux only
    # dll-ffi-os defaults to all platforms
