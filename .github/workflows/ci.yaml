name: CI

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (defaults to github.ref)
        type: string

jobs:
  verify-transcripts:
    name: verify transcripts proof
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: debug transcript proof inputs
        run: |
          echo "=== files included in transcript proof hash ==="
          ./scripts/proofs/transcripts.sh --list-files
      - name: verify transcript proof
        run: |
          read -r RESULT HASH <<< "$(./scripts/proofs/transcripts.sh --check)"
          if [[ "$RESULT" == "pass" ]]; then
            echo "Transcript proof: pass ($HASH)"
            exit 0
          elif [[ "$RESULT" == "partial" ]]; then
            echo "::notice::Transcript proof is partial ($HASH): only the transcripts listed in .github/workflows/proofs/transcripts/$HASH-partial.txt were run. The merge queue runs them all."
            cat ".github/workflows/proofs/transcripts/$HASH-partial.txt"
            exit 0
          elif [[ "$RESULT" == "fail" ]]; then
            echo "::error::Transcripts previously FAILED for hash $HASH. Fix and re-run './scripts/proofs/transcripts.sh'."
            exit 1
          elif [[ "$RESULT" == "nofile" ]]; then
            echo "::error::Transcript proof file not found (hash $HASH). Run './scripts/proofs/transcripts.sh', commit the proofs file, and push again."
            exit 1
          else
            echo "::error::Transcript proof has no entry for hash $HASH. Run './scripts/proofs/transcripts.sh', commit the proofs file, and push again."
            exit 1
          fi

  verify-helper-ir:
    # The JIT's embedded IR (unison-runtime/cbits/jit_helpers.ll, jit_exit.ll)
    # runs natively in every JIT'd process. Its header names the SHA-256 of
    # the C it was generated from; this checks that the C has not changed
    # since without a regeneration. The regeneration itself (gen-helpers.sh
    # --check, which needs clang and the GHC headers) runs in test.yaml's
    # build job.
    name: verify the JIT's embedded IR names its sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: compare each .ll header's source hash with the sources
        run: |
          cd unison-runtime/cbits
          status=0
          check() {
            ll="$1"; shift
            want=$(cat "$@" | shasum -a 256 | cut -d' ' -f1)
            have=$(sed -n 's/^; source sha256: \([0-9a-f]*\).*/\1/p' "$ll" | head -n 1)
            if [[ "$have" == "$want" ]]; then
              echo "$ll names its sources ($want)"
            else
              echo "::error::$ll names source hash ${have:-none} but $* hash to $want: the C changed and the IR was not regenerated. Run unison-runtime/cbits/gen-helpers.sh and commit the .ll files."
              status=1
            fi
          }
          check jit_helpers.ll jit_helpers.c jit_internal.h jit_rt.h
          check jit_exit.ll jit_exit.c jit_rt.h
          exit $status

  verify-tests:
    name: verify tests proof
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: debug test proof inputs
        run: |
          echo "=== files included in test proof hash ==="
          ./scripts/proofs/tests.sh --list-files
      - name: verify test proof
        run: |
          read -r RESULT HASH <<< "$(./scripts/proofs/tests.sh --check)"
          if [[ "$RESULT" == "pass" ]]; then
            echo "Test proof: pass ($HASH)"
            exit 0
          elif [[ "$RESULT" == "fail" ]]; then
            echo "::error::Tests previously FAILED for hash $HASH. Fix and re-run './scripts/proofs/tests.sh'."
            exit 1
          elif [[ "$RESULT" == "nofile" ]]; then
            echo "::error::Test proof file not found (hash $HASH). Run './scripts/proofs/tests.sh', commit the proofs file, and push again."
            exit 1
          else
            echo "::error::Test proof has no entry for hash $HASH. Run './scripts/proofs/tests.sh', commit the proofs file, and push again."
            exit 1
          fi

  verify-migration:
    name: verify migration proof
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: verify migration proof
        run: |
          read -r RESULT HASH <<< "$(./scripts/proofs/migration.sh --check)"
          if [[ "$RESULT" == "pass" ]]; then
            echo "Migration proof: pass ($HASH)"
          elif [[ "$RESULT" == "fail" ]]; then
            echo "::error::Migration previously FAILED for hash $HASH. Fix and re-run './scripts/proofs/migration.sh'."
            exit 1
          elif [[ "$RESULT" == "nofile" ]]; then
            echo "::error::Migration proof file not found (hash $HASH). Run './scripts/proofs/migration.sh', commit the proofs file, and push again."
            exit 1
          else
            echo "::error::Migration proof has no entry for hash $HASH. Run './scripts/proofs/migration.sh', commit the proofs file, and push again."
            exit 1
          fi
      - name: verify the proof is for the latest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          recorded=$(cat .github/workflows/proofs/migration-release.txt)
          latest=$(./scripts/migration-test.sh --latest)
          if [[ "$recorded" == "$latest" ]]; then
            echo "Migration proof is for the latest release ($latest)"
          else
            echo "::error::The migration proof was recorded against $recorded but the latest release is $latest. Run './scripts/proofs/migration.sh', commit the proofs files, and push again."
            exit 1
          fi

  verify-proofs:
    name: verify proofs
    needs: [verify-transcripts, verify-tests, verify-migration]
    runs-on: ubuntu-24.04
    steps:
      - name: check all proofs
        run: |
          if [[ "${{ needs.verify-transcripts.result }}" != "success" ]]; then
            echo "verify-transcripts: ${{ needs.verify-transcripts.result }}"
            exit 1
          fi
          if [[ "${{ needs.verify-tests.result }}" != "success" ]]; then
            echo "verify-tests: ${{ needs.verify-tests.result }}"
            exit 1
          fi
          if [[ "${{ needs.verify-migration.result }}" != "success" ]]; then
            echo "verify-migration: ${{ needs.verify-migration.result }}"
            exit 1
          fi
