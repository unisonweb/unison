name: CI

defaults:
  run:
    shell: bash

on:
  push:
    branches-ignore:
      - 'gh-readonly-queue/**'
  merge_group:
  workflow_dispatch:

jobs:
  # Verify proofs on feature branches (not trunk, since trunk runs actual tests)
  # This runs on a single platform since it just checks file contents
  verify-proofs:
    name: verify proofs
    # Don't run on trunk or in merge queue (merge queue runs actual tests)
    if: github.ref != 'refs/heads/trunk' && github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - run: sudo apt-get install -y ripgrep
      - name: verify transcript proof
        run: |
          RESULT=$(./scripts/proofs/transcripts.sh --check)
          echo "Transcript proof: $RESULT"
          if [[ "$RESULT" == "pass" ]]; then
            exit 0
          elif [[ "$RESULT" == "fail" ]]; then
            echo "::error::Transcripts previously FAILED. Fix and re-run './scripts/proofs/transcripts.sh'."
            exit 1
          else
            echo "::error::Transcript proof not found. Run './scripts/proofs/transcripts.sh', commit the proofs file, and push again."
            exit 1
          fi

      - name: verify test proof
        run: |
          RESULT=$(./scripts/proofs/tests.sh --check)
          echo "Test proof: $RESULT"
          if [[ "$RESULT" == "pass" ]]; then
            exit 0
          elif [[ "$RESULT" == "fail" ]]; then
            echo "::error::Tests previously FAILED. Fix and re-run './scripts/proofs/tests.sh'."
            exit 1
          else
            echo "::error::Test proof not found. Run './scripts/proofs/tests.sh', commit the proofs file, and push again."
            exit 1
          fi

  # Run tests in merge queue to validate before landing on trunk
  merge-queue-tests:
    name: merge queue tests
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/test.yaml
    with:
      skip-attested-transcripts: true
    # transcripts-os defaults to linux only
    # dll-ffi-os defaults to all platforms

  # Single gate job for merge queue required checks.
  # Set "merge queue gate" as the sole required status check in branch protection.
  merge-queue-gate:
    name: merge queue gate
    if: github.event_name == 'merge_group' && !cancelled()
    needs: [merge-queue-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: check all jobs
        run: |
          if [[ "${{ needs.merge-queue-tests.result }}" != "success" ]]; then
            echo "merge-queue-tests result: ${{ needs.merge-queue-tests.result }}"
            exit 1
          fi
