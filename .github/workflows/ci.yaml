name: CI

defaults:
  run:
    shell: bash

on:
  push:
  workflow_dispatch:

env:
  ## Some version numbers that are used during CI
  runtime_tests_version: "@unison/runtime-tests/releases/0.0.6"

  ## Some cached directories
  # a temp path for caching a built `ucm`
  ucm_local_bin: ucm-local-bin
  # a codebase path for caching a codebase generated by `unison-src/builtin-tests/interpreter-tests.md`
  runtime_tests_codebase: "~/.cache/unisonlanguage/runtime-tests.unison"
  # locations of some files that will indicate whether we need to re-run certain steps
  transcript_test_results: transcript-test-results
  interpreter_test_results: interpreter-test-results

  # work around https://github.com/actions/cache/issues/1547 which may continue causing failures until March 1, 2025
  ACTIONS_CACHE_SERVICE_V2: true

jobs:
  # Verify proofs on feature branches (not trunk, since trunk runs actual tests)
  # This runs on a single platform since it just checks file contents
  verify-proofs:
    name: verify proofs
    if: github.ref != 'refs/heads/trunk'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - run: sudo apt install ripgrep
      - name: verify transcript proof
        run: |
          PROOFS_FILE=".github/workflows/proofs/transcripts.txt"
          echo "Computing transcript hash..."
          HASH=$(./scripts/proofs/transcripts.sh --hash)
          echo "Hash: $HASH"

          # Check if proof file exists and contains our hash with pass status
          # Format: "source_hash infra_hash pass|fail"
          PROOF_LINE=""
          if [[ -f "$PROOFS_FILE" ]]; then
            PROOF_LINE=$(grep "^$HASH" "$PROOFS_FILE" || true)
          fi

          RESULT=$(echo "$PROOF_LINE" | awk '{print $3}')

          if [[ "$RESULT" == "pass" ]]; then
            echo "Transcript proof verified (passed)!"
          elif [[ "$RESULT" == "fail" ]]; then
            echo ""
            echo "ERROR: Transcripts previously FAILED."
            echo ""
            echo "The proofs file shows that transcripts failed on this commit."
            echo "Fix the issues, run './scripts/proofs/transcripts.sh',"
            echo "commit the updated proofs file, and push again."
            exit 1
          else
            echo ""
            echo "ERROR: Transcript proof not found."
            echo ""
            echo "This repo uses a proof system to skip transcript tests in CI when"
            echo "you've already run them locally. The proof is a hash of all source"
            echo "files that affect transcripts (*.hs, *.md, *.u, build configs)."
            echo ""
            echo "Expected hash: $HASH"
            echo "Proofs file:   $(cat "$PROOFS_FILE" 2>/dev/null || echo "(not found)")"
            echo ""
            echo "This usually means you changed code after running transcripts,"
            echo "or haven't run them yet."
            echo ""
            echo "To fix: run './scripts/proofs/transcripts.sh', commit the"
            echo "proofs file, and push again."
            echo ""
            echo "TIP: The pre-push hook handles this automatically on push:"
            echo "  ./scripts/hooks/install.bash"
            exit 1
          fi

      - name: verify test proof
        run: |
          PROOFS_FILE=".github/workflows/proofs/tests.txt"
          echo "Computing test hash..."
          HASH=$(./scripts/proofs/tests.sh --hash)
          echo "Hash: $HASH"

          # Check if proof file exists and contains our hash with pass status
          # Format: "source_hash infra_hash pass|fail"
          PROOF_LINE=""
          if [[ -f "$PROOFS_FILE" ]]; then
            PROOF_LINE=$(grep "^$HASH" "$PROOFS_FILE" || true)
          fi

          RESULT=$(echo "$PROOF_LINE" | awk '{print $3}')

          if [[ "$RESULT" == "pass" ]]; then
            echo "Test proof verified (passed)!"
          elif [[ "$RESULT" == "fail" ]]; then
            echo ""
            echo "ERROR: Tests previously FAILED."
            echo ""
            echo "The proofs file shows that tests failed on this commit."
            echo "Fix the issues, run './scripts/proofs/tests.sh',"
            echo "commit the updated proofs file, and push again."
            exit 1
          else
            echo ""
            echo "ERROR: Test proof not found."
            echo ""
            echo "This repo uses a proof system to skip tests in CI when you've"
            echo "already run them locally. The proof is a hash of all source files"
            echo "that affect tests (*.hs, build configs, integration test inputs)."
            echo ""
            echo "Expected hash: $HASH"
            echo "Proofs file:   $(cat "$PROOFS_FILE" 2>/dev/null || echo "(not found)")"
            echo ""
            echo "This usually means you changed code after running tests,"
            echo "or haven't run them yet."
            echo ""
            echo "To fix: run './scripts/proofs/tests.sh', commit the"
            echo "proofs file, and push again."
            echo ""
            echo "TIP: The pre-push hook handles this automatically on push:"
            echo "  ./scripts/hooks/install.bash"
            exit 1
          fi

  build-ucm:
    name: build ucm
    if: github.ref == 'refs/heads/trunk'
    runs-on: ${{ matrix.os }}
    strategy:
      # Run each build to completion, regardless of if any have failed
      fail-fast: false
      matrix:
        os:
          # While iterating on this file, you can disable one or more of these to speed things up
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-latest
          - windows-2025
          # - windows-11-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: tweak environment
        id: tweak-environment
        run: |
          ucm_local_bin="${RUNNER_TEMP//\\//}/${ucm_local_bin}"
          echo "ucm_local_bin=$ucm_local_bin" >> $GITHUB_ENV

          if [[ ${{runner.os}} = "Windows" ]]; then
            echo "ucm=$ucm_local_bin/unison.exe" >> $GITHUB_ENV
            echo "transcripts=$ucm_local_bin/transcripts.exe" >> $GITHUB_ENV
          else
            echo "ucm=$ucm_local_bin/unison" >> $GITHUB_ENV
            echo "transcripts=$ucm_local_bin/transcripts" >> $GITHUB_ENV
          fi

      - name: cache ucm binaries
        id: cache-ucm-binaries
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4
        with:
          path: ${{env.ucm_local_bin}}
          key: ucm-${{ matrix.os }}-${{ hashFiles('**/ci.yaml', '**/stack.yaml', '**/package.yaml', '**/*.hs', '**/unison-cli-integration/integration-tests/IntegrationTests/*')}}
          # added the integration test dependencies here as if they were source, for simplicity

      - name: restore stack caches
        if: steps.cache-ucm-binaries.outputs.cache-hit != 'true'
        id: restore-stack-caches
        uses: unisonweb/actions/stack/cache/restore@main
        with:
          cache-prefix: ci

      - name: install stack
        if: steps.cache-ucm-binaries.outputs.cache-hit != 'true'
        uses: unisonweb/actions/stack/install@main
        with:
          stack-version: 3.7.1

      # Build deps, then build local code. Splitting it into two steps just allows us to see how much time each step
      # takes.
      - name: build dependencies
        if: steps.cache-ucm-binaries.outputs.cache-hit != 'true'
        # Run up to 5 times in a row before giving up.
        # It's very unlikely that our build-dependencies step will fail on most builds,
        # so if it fails its almost certainly due to a race condition on the Windows
        # file-system API that stack runs into. Since any successful packages are
        # cached within a single build, it should get further along on each re-start
        # and should hopefully finish!
        run: |
          stack --version
          tries=1
          if [[ ${{matrix.os}} = "windows-"* ]]; then
            tries=5
          fi

          for (( i = 0; i < $tries; i++ )); do
              stack build --fast --only-dependencies --test --bench && break;
          done

      - name: build
        if: steps.cache-ucm-binaries.outputs.cache-hit != 'true'
        run: |
          stack build \
            --fast \
            --test \
            --no-run-tests \
            --local-bin-path ${{env.ucm_local_bin}} \
            --copy-bins

      # The unison-cli test requires a git user.
      - name: set git user info
        if: steps.cache-ucm-binaries.outputs.cache-hit != 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # Run each test suite
      - name: unison-cli test
        if: steps.cache-ucm-binaries.outputs.cache-hit != 'true'
        run: stack build --fast --test unison-cli

      - name: unison-core tests
        if: steps.cache-ucm-binaries.outputs.cache-hit != 'true'
        run: stack build --fast --test unison-core

      - name: unison-parser-typechecker tests
        if: steps.cache-ucm-binaries.outputs.cache-hit != 'true'
        run: stack build --fast --test unison-parser-typechecker

      - name: unison-sqlite tests
        if: steps.cache-ucm-binaries.outputs.cache-hit != 'true'
        run: stack build --fast --test unison-sqlite

      - name: unison-syntax tests
        if: steps.cache-ucm-binaries.outputs.cache-hit != 'true'
        run: stack build --fast --test unison-syntax

      - name: unison-util-bytes tests
        if: steps.cache-ucm-binaries.outputs.cache-hit != 'true'
        run: stack build --fast --test unison-util-bytes

      - name: unison-util-cache tests
        if: steps.cache-ucm-binaries.outputs.cache-hit != 'true'
        run: stack build --fast --test unison-util-cache

      - name: unison-util-relation tests
        if: steps.cache-ucm-binaries.outputs.cache-hit != 'true'
        run: stack build --fast --test unison-util-relation

      - name: cli-integration-tests
        if: steps.cache-ucm-binaries.outputs.cache-hit != 'true'
        run: |
          stack exec cli-integration-tests
          # Fail if any transcripts cause git diffs.
          git diff --ignore-cr-at-eol --exit-code unison-cli-integration/integration-tests

      - name: check for dead code
        if: false && runner.arch == 'x64' && runner.os == 'Linux' && steps.cache-ucm-binaries.outputs.cache-hit != 'true'
        uses: freckle/weeder-action@8a97af19a69ef455f26d1fa8b0c19f9a2a90209a # v3
        with:
          # NB: This uses weeder 2.10.0, because the version is tied to the selected GHC version. See
          #     freckle/weeder-action#146.
          ghc-version: "9.10.3" # This needs to match the resolver in stack.yaml
          # NB: This set of flags is expanded from ../../scripts/check-weeds.
          weeder-arguments: |
            --require-hs-files
            --no-default-fields
            --hie-directory
            ./unison-cli-integration/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./unison-share-projects-api/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./codebase2/util-term/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./codebase2/codebase-sqlite/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./codebase2/core/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./codebase2/codebase/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./codebase2/codebase-sync/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./codebase2/util-serialization/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./codebase2/codebase-sqlite-hashing-v2/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./unison-share-api/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./unison-cli-main/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./parser-typechecker/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./unison-cli/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./yaks/easytest/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./lib/unison-util-recursion/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./lib/unison-util-cache/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./lib/unison-prelude/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./lib/unison-util-bytes/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./lib/unison-util-file-embed/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./lib/unison-sqlite/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./lib/unison-util-relation/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./lib/unison-hashing/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./lib/unison-pretty-printer/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./lib/unison-util-base32hex/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./lib/unison-hash/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./lib/unison-util-rope/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./lib/unison-dynlib/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./lib/orphans/unison-hash-orphans-sqlite/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./lib/orphans/network-uri-orphans-sqlite/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./lib/orphans/uuid-orphans-sqlite/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./lib/orphans/unison-hash-orphans-aeson/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./lib/orphans/unison-core-orphans-sqlite/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./lib/unison-credentials/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./unison-core/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./unison-runtime/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./unison-merge/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./unison-syntax/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3
            --hie-directory
            ./unison-hashing-v2/.stack-work/dist/x86_64-linux-tinfo6/ghc-9.10.3

      - name: verify stack ghci startup
        if: runner.os == 'macOS' && steps.cache-ucm-binaries.outputs.cache-hit != 'true'
        run: echo | stack ghci

      - name: save ucm artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: unison-${{ matrix.os }}
          path: ${{ env.ucm }}
          if-no-files-found: error

      - name: save built binaries
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          path: ${{ env.ucm_local_bin }}
          name: local-bin-${{ matrix.os }}
          if-no-files-found: error

      - name: save stack caches
        if: |
          !cancelled()
            && steps.restore-stack-caches.outputs.cache-hit != 'true'
            && steps.cache-ucm-binaries.outputs.cache-hit != 'true'
        uses: unisonweb/actions/stack/cache/save@main
        with:
          cache-prefix: ci

  dll-ffi-tests:
    name: dll-ffi tests
    needs: build-ucm
    if: github.ref == 'refs/heads/trunk'
    runs-on: ${{ matrix.os }}
    strategy:
      # Run each build to completion, regardless of if any have failed
      fail-fast: false
      matrix:
        os:
          # While iterating on this file, you can disable one or more of these to speed things up
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-latest
          - windows-2025
          # - windows-11-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: tweak environment
        run: |
          ucm_local_bin="${RUNNER_TEMP//\\//}/${ucm_local_bin}"
          echo "ucm_local_bin=$ucm_local_bin" >> $GITHUB_ENV

          if [[ ${{runner.os}} = "Windows" ]]; then
            echo "ucm=$ucm_local_bin/unison.exe" >> $GITHUB_ENV
          else
            echo "ucm=$ucm_local_bin/unison" >> $GITHUB_ENV
          fi

      - name: restore binaries
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          path: ${{env.ucm_local_bin}}
          name: local-bin-${{matrix.os}}

      - name: set built binaries permissions
        run: chmod +x ${{env.ucm_local_bin}}/*

      # DLL-FFI tests still run in CI because they involve platform-specific C compilation
      # that isn't covered by the transcript hash (which only includes *.hs, *.md, *.u files)
      - name: dll-ffi-unix smoke tests
        if: runner.os != 'Windows'
        run: |
          clang -fPIC -c -o \
            unison-src/transcripts-manual/dll-ffi/test.o \
            unison-src/transcripts-manual/dll-ffi/test.c

          clang -shared -o \
            unison-src/transcripts-manual/dll-ffi/libtest.so \
            unison-src/transcripts-manual/dll-ffi/test.o

          ${{env.ucm}} transcript unison-src/transcripts-manual/dll-ffi-unix.md

          # Fail if the output or generated docs differ.
          git diff --ignore-cr-at-eol --exit-code \
            unison-src/transcripts-manual/dll-ffi-unix.output.md

      - name: dll-ffi-win smoke tests
        if: runner.os == 'Windows'
        run: |
          clang -DWINDOWS_BUILD -c -o \
            unison-src/transcripts-manual/dll-ffi/test.o \
            unison-src/transcripts-manual/dll-ffi/test.c

          clang -DWINDOWS_BUILD -shared -o \
            unison-src/transcripts-manual/dll-ffi/libtest.dll \
            unison-src/transcripts-manual/dll-ffi/test.o

          ${{env.ucm}} transcript unison-src/transcripts-manual/dll-ffi-win.md

          # Fail if the output or generated docs differ.
          git diff --ignore-cr-at-eol --exit-code \
            unison-src/transcripts-manual/dll-ffi-win.output.md

  interpreter-tests:
    name: run interpreter tests
    needs: build-ucm
    if: github.ref == 'refs/heads/trunk'
    runs-on: ${{ matrix.os }}
    strategy:
      # Run each build to completion, regardless of if any have failed
      fail-fast: false
      matrix:
        os:
          # While iterating on this file, you can disable one or more of these to speed things up
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-latest
          # - windows-2025 fails! :-\ https://github.com/unisonweb/unison/actions/runs/15706568824/job/44253742036?pr=5765
          # - windows-11-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: tweak environment
        run: |
          interpreter_test_results="${RUNNER_TEMP//\\//}/${interpreter_test_results}"
          echo "interpreter_test_results=$interpreter_test_results" >> $GITHUB_ENV

          ucm_local_bin="${RUNNER_TEMP//\\//}/${ucm_local_bin}"
          echo "ucm_local_bin=$ucm_local_bin" >> $GITHUB_ENV

          if [[ ${{runner.os}} = "Windows" ]]; then
            echo "ucm=$ucm_local_bin/unison.exe" >> $GITHUB_ENV
            echo "transcripts=$ucm_local_bin/transcripts.exe" >> $GITHUB_ENV
          else
            echo "ucm=$ucm_local_bin/unison" >> $GITHUB_ENV
            echo "transcripts=$ucm_local_bin/transcripts" >> $GITHUB_ENV
          fi
      - name: look up hash for runtime tests
        run: echo "runtime_tests_causalhash=$(scripts/get-share-hash.sh ${{env.runtime_tests_version}})" >> $GITHUB_ENV
      - name: cache interpreter test results
        id: cache-interpreter-test-results
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4
        with:
          path: ${{env.interpreter_test_results}}
          key: interpreter-test-results-${{ matrix.os }}-${{ hashFiles('**/ci.yaml', '**/stack.yaml', '**/package.yaml', '**/*.hs')}}-${{ hashFiles('**/interpreter-tests.tpl.md') }}-${{env.runtime_tests_causalhash}}
      - name: cache testing codebase
        id: cache-testing-codebase
        if: steps.cache-interpreter-test-results.outputs.cache-hit != 'true'
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4
        with:
          path: ${{ env.runtime_tests_codebase }}
          key: runtime-tests-codebase-${{env.runtime_tests_causalhash}}
          restore-keys: runtime-tests-codebase-
      - name: restore binaries
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        if: steps.cache-interpreter-test-results.outputs.cache-hit != 'true'
        with:
          path: ${{env.ucm_local_bin}}
          name: local-bin-${{ matrix.os }}
      - name: set binaries permissions
        if: steps.cache-interpreter-test-results.outputs.cache-hit != 'true'
        run: chmod +x ${{env.ucm_local_bin}}/*
      - name: interpreter tests
        # this one should be re-run if the ucm binaries have changed or unison-src/ has changed
        if: steps.cache-interpreter-test-results.outputs.cache-hit != 'true'
        run: |
          UNISON_MIGRATION=auto unison-src/builtin-tests/interpreter-tests.sh ${{ env.ucm }}
          cat unison-src/builtin-tests/interpreter-tests.output.md
          git diff --exit-code unison-src/builtin-tests/interpreter-tests.output.md
      - name: mark interpreter tests as passing
        if: steps.cache-interpreter-test-results.outputs.cache-hit != 'true'
        run: |
          echo "passing=true" >> "${{env.interpreter_test_results}}"
