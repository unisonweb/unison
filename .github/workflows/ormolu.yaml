# This workflow runs ormolu on all Haskell files in the branch and creates a PR with the result.
# (The ormolu job in CI.yaml only runs ormolu on Haskell files that have changed in that PR.)

name: ormolu everything

on:
  workflow_dispatch:
    inputs:
      force:
        description: Run even if formatting attestation passes
        type: boolean
        default: false

env:
  ormolu_version: "0.8.0.2"

jobs:
  check-formatting-proof:
    name: check formatting proof
    if: ${{ !inputs.force }}
    runs-on: ubuntu-24.04
    outputs:
      attested: ${{ steps.check.outputs.attested }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: check formatting proof
        id: check
        run: |
          read -r RESULT HASH <<< "$(./scripts/proofs/formatting.sh --check)"
          if [[ "$RESULT" == "pass" ]]; then
            echo "Formatting proof: pass ($HASH)"
            echo "attested=true" >> "$GITHUB_OUTPUT"
          elif [[ "$RESULT" == "fail" ]]; then
            echo "::error::Formatting previously FAILED for hash $HASH"
            exit 1
          else
            echo "Formatting proof: $RESULT ($HASH)"
            echo "attested=false" >> "$GITHUB_OUTPUT"
          fi

  ormolu:
    needs: check-formatting-proof
    if: |
      !cancelled()
        && (inputs.force || needs.check-formatting-proof.outputs.attested != 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: haskell-actions/run-ormolu@c5eec49879ee294be01c787bcbf7b5a373a37060 # v17
        with:
          version: ${{ env.ormolu_version }}
          mode: inplace
      - name: create pull request with formatting changes
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          commit-message: automatically run ormolu
          branch: autoformat/${{github.ref_name}}
          branch-suffix: short-commit-hash
          title: format `${{github.ref_name}}` with ormolu ${{env.ormolu_version}}
