name: Close inactive issues and pull requests

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: close-inactive-issues
  cancel-in-progress: false

jobs:
  close-inactive:
    runs-on: ubuntu-24.04
    steps:
      - name: Ensure the inactivity label exists
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const name = 'inactive-180-days';
            try {
              await github.rest.issues.getLabel({ owner, repo, name });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({ owner, repo, name, color: 'ededed' });
            }
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10
        with:
          days-before-stale: 180
          days-before-close: 0
          # Use a dedicated label so pre-existing stale labels do not trigger early closure.
          stale-issue-label: inactive-180-days
          stale-pr-label: inactive-180-days
          close-issue-message: >-
            Closing this issue because it has had no activity for 180 days.
            If you opened this issue and it is still relevant, comment `/reopen` to reopen it.
          close-pr-message: >-
            Closing this pull request because it has had no activity for 180 days.
            Please reopen it if it is still relevant.
          # Process the oldest updates first, in batches to avoid rate limits.
          sort-by: updated
          ascending: true
          operations-per-run: 100
