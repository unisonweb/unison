name: unison-credentials
github: unisonweb/unison
copyright: Copyright (C) 2013-2025 Unison Computing, PBC and contributors

ghc-options: -Wall -fno-warn-name-shadowing -fno-warn-missing-pattern-synonym-signatures

dependencies:
  - base
  - aeson
  - bytestring
  - containers
  - crypton
  - filepath
  - jose
  - text
  - base64-bytestring
  - lens
  - lock-file
  - memory
  - mtl
  - network-uri
  - time
  - transformers
  - unison-core1
  - unison-prelude
  - unliftio

library:
  source-dirs: src
  when:
    - condition: false
      other-modules: Paths_unison_credentials

default-extensions:
  - ApplicativeDo
  - BangPatterns
  - BlockArguments
  - DeriveAnyClass
  - DeriveFunctor
  - DeriveGeneric
  - DeriveTraversable
  - DerivingStrategies
  - DerivingVia
  - DoAndIfThenElse
  - DuplicateRecordFields
  - FlexibleContexts
  - FlexibleInstances
  - GeneralizedNewtypeDeriving
  - ImportQualifiedPost
  - LambdaCase
  - MultiParamTypeClasses
  - NamedFieldPuns
  - OverloadedRecordDot
  - OverloadedStrings
  - PatternSynonyms
  - RankNTypes
  - ScopedTypeVariables
  - StandaloneDeriving
  - TupleSections
  - TypeApplications
  - TypeFamilies
  - ViewPatterns
