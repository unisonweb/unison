name: unison-runtime
github: unisonweb/unison
copyright: Copyright (C) 2013-2024 Unison Computing, PBC and contributors

ghc-options: -fmax-worker-args=100 -Wall -funbox-strict-fields -O2

flags:
  arraychecks:
    manual: true
    default: false
  stackchecks:
    manual: true
    default: false

  # Run optimization assertion tests, make sure this runs with O2
  optchecks:
    manual: true
    default: false

  # Run code through the serializer to test code loading as if it were
  # remote.
  codeserialchecks:
    manual: true
    default: false

  # Dumps core for debugging to unison-runtime/.stack-work/dist/<arch>/ghc-x.y.z/build/
  dumpcore:
    manual: true
    default: false

when:
  - condition: flag(arraychecks)
    cpp-options: -DARRAY_CHECK
  - condition: flag(stackchecks)
    cpp-options: -DSTACK_CHECK
  - condition: flag(optchecks)
    ghc-options: -O2
    cpp-options: -DOPT_CHECK
    dependencies:
      - inspection-testing
  - condition: flag(codeserialchecks)
    ghc-options: -DCODE_SERIAL_CHECK
  - condition: flag(dumpcore)
    ghc-options: -ddump-simpl -ddump-stg-final -ddump-to-file -dsuppress-coercions -dsuppress-idinfo -dsuppress-module-prefixes -ddump-str-signatures -ddump-simpl-stats # -dsuppress-type-applications -dsuppress-type-signatures

# The LLVM IR of the helpers generated code calls as IR and of the exit
# routine (cbits/gen-helpers.sh), embedded by src/Unison/Runtime/JIT/Helpers.hs;
# listed so that a change to either rebuilds that module.
extra-source-files:
  - cbits/jit_builtins*.c
  - cbits/jit_*.h
  - cbits/jit_helpers.ll
  - cbits/jit_exit.ll

# The runtime is two libraries. The internal library `core` (src) is what
# running compiled code needs: the machine, the builtins, the JIT, and the
# readers of compiled code. It depends on nothing that parses, typechecks
# or pretty-prints Unison, so that unisonrt, which runs .uc files, is
# built from it alone. The main library (ucm) is what ucm adds on top:
# compiling terms from a codebase to ANF, decompiling values back to terms,
# and the Runtime interface.
internal-libraries:
  core:
    source-dirs: src
    when:
      - condition: false
        other-modules: Paths_unison_runtime
      - condition: "!os(windows)"
        dependencies: unix
        c-sources: cbits/signals.c

    c-sources:
      - cbits/i2d.c
      # The JIT (src/Unison/Runtime/JIT/design.md). LLVM isn't linked: jit_llvm.c
      # loads it at run time when the JIT is turned on, so building needs no LLVM.
      # (cbits/jit_exit.c is not built here: it is only ever compiled to IR,
      # by gen-helpers.sh, and compiled again by the JIT at startup.)
      - cbits/jit_llvm.c
      # The JIT's C runtime, one translation unit: jit_rt.c is the machinery
      # (entering native code, allocation, the trampoline, the startup probes)
      # and includes the native builtins, one file per family
      # (cbits/jit_builtins_*.c, sharing cbits/jit_builtins.h), and
      # cbits/jit_helpers.c, which is also compiled to IR for the JIT
      # (cbits/gen-helpers.sh, jit_helpers.ll).
      - cbits/jit_rt.c

    dependencies:
    - asn1-encoding
    - asn1-types
    - atomic-primops
    - base
    - bytes
    - bytestring
    - clock
    - containers >= 0.6.3
    - crypton
    - crypton-x509
    - crypton-x509-store
    - crypton-x509-system
    - crypton-x509-validation
    - data-default
    - data-memocombinators
    - deepseq
    - directory
    - exceptions
    - filepath
    - hashable
    - inspection-testing
    - iproute
    - lens
    - libffi
    - memory
    - mtl
    - murmur-hash
    - network
    - network-simple
    - network-udp
    - pem
    - primitive
    - process
    - safe-exceptions
    - stm
    - tagged
    - template-haskell
    - temporary
    - text
    - time
    - tls
    - transformers
    - unison-core
    - unison-core1
    - unison-dynlib
    - unison-hash
    - unison-prelude
    - unison-util-bytes
    - unison-util-file-embed
    - unison-util-relation
    - unison-util-rope
    - unliftio
    - unordered-containers
    - vector

library:
  source-dirs: ucm
  when:
    - condition: false
      other-modules: Paths_unison_runtime
  # the modules of `core` that other packages use
  reexported-modules:
    - Unison.Runtime.JIT
    - Unison.Runtime.JIT.Config
    - Unison.Runtime.Version
  dependencies:
    - base
    - bytestring
    - containers >= 0.6.3
    - core
    - filepath
    - lens
    - mmorph
    - mtl
    - raw-strings-qq
    - stm
    - text
    - unison-codebase-sqlite
    - unison-core
    - unison-core1
    - unison-parser-typechecker
    - unison-prelude
    - unison-pretty-printer
    - unison-syntax
    - unison-util-bytes
    - unison-util-recursion
    - unliftio
    - vector

executables:
  # Runs a compiled program (a .uc file), without a codebase: see
  # unisonrt/README.md.
  unisonrt:
    source-dirs: unisonrt
    main: Main.hs
    # main.c is the program's entry: it stops the RTS reading flags after
    # the .uc file, which belong to the program
    c-sources: unisonrt/main.c
    ghc-options: -threaded -rtsopts -no-hs-main
    when:
      - condition: false
        other-modules: Paths_unison_runtime
    dependencies:
      - base
      - bytestring
      - core
      - text
      - unison-core
      - unison-core1

tests:
  runtime-tests:
    source-dirs: tests
    main: Suite.hs
    ghc-options: -W -threaded -rtsopts "-with-rtsopts=-N -T" -v0
    when:
      - condition: false
        other-modules: Paths_unison_parser_typechecker
      - condition: "!os(windows)"
        dependencies: unix
        c-sources: tests/cbits/signals.c
    dependencies:
      - async
      - base
      - bytestring
      - code-page
      - containers
      - crypton
      - directory
      - easytest
      - hedgehog
      - filemanip
      - filepath
      - hex-text
      - lens
      - megaparsec
      - mtl
      - primitive
      - process
      - stm
      - text
      - unison-core1
      - unison-hash
      - unison-util-bytes
      - unison-util-relation
      - unison-util-rope
      - unison-parser-typechecker
      - unison-prelude
      - unison-pretty-printer
      - unison-runtime
      - core
      - unison-syntax

default-extensions:
  - ApplicativeDo
  - BangPatterns
  - BlockArguments
  - DeriveAnyClass
  - DeriveFunctor
  - DeriveGeneric
  - DeriveTraversable
  - DerivingStrategies
  - DerivingVia
  - DoAndIfThenElse
  - DuplicateRecordFields
  - FlexibleContexts
  - FlexibleInstances
  - GeneralizedNewtypeDeriving
  - ImportQualifiedPost
  - LambdaCase
  - MultiParamTypeClasses
  - NamedFieldPuns
  - OverloadedLabels
  - OverloadedRecordDot
  - OverloadedStrings
  - PatternSynonyms
  - RankNTypes
  - ScopedTypeVariables
  - StandaloneDeriving
  - TupleSections
  - TypeApplications
  - TypeFamilies
  - ViewPatterns
