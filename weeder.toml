    '''^Unison\.Util\.Relation$''',
    '''^Unison\.Util\.Relation3$''',
    '''^Unison\.Util\.Relation4$''',
    '''^Unison\.Util\.Rope$''',

    ## Debugging tools – not used in production, but often enabled during development\.
    '''^Unison\.Debug$''',
    '''^Unison\.Runtime\.Debug$''',
]
